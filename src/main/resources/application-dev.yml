#database configuration

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:docmind}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# open ai
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:8b
        temperature: 0.2
      embedding:
          model: nomic-embed-text

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: cosine_distance
        dimensions: 768
        table-name: vector_store
        schema-name: public
        initialize-schema: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB


# app configuration
app:
  rag:
    chunk-size: 700
#    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.0

  cors:
    allowed-origins: "*"
    allowed-methods: GET, POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true


#jwt configurations

jwt:
  secret: ${JWT_SECRET:sdafasfasfasdhfojhascapfdaDHAfbashfabfashfasbfshfdasfhqf}
  expiration: 3600000


bootui:
  enabled: ON


logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG